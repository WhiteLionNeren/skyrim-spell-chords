; Spell Chords: 12 extra favorites slots on Ctrl/Shift/Alt + 1-4.
; Assign: in the Favorites menu, highlight an entry and press the chord (same chord again clears it).
; Use: press the chord in game; it works exactly like a vanilla hotkey (vanilla hotkey 8 is borrowed for one frame).
; Keys are DirectInput scan codes (0x1D LCtrl, 0x2A LShift, 0x38 LAlt, 0x02-0x05 = 1-4).
[General]
Enabled=1
; how long a modifier waits for a number before the game gets it (sprint/run start this much later)
HoldMs=150
; on-screen notice when a slot is assigned or cleared
Notify=1
[Keys]
Modifier1=29
Modifier2=42
Modifier3=56
Number1=2
Number2=3
Number3=4
Number4=5
; Spell bar: HUD action bar of keys 1-4 (vanilla hotkeys) and the Ctrl/Shift/Alt chord rows. Needs SKSE Menu
; Framework 3. Also editable in game: F1 > Spell Chords > Spell Bar ("Save to SpellChords.ini" writes here).
[Bar]
Enabled=1
; 0 = all rows (plain row + modifier rows with slots; the held modifier's row lights up), 1 = one row that pages to the held modifier
Layout=0
; 0 = always, 1 = weapon/magic drawn or in combat, 2 = in combat only
ShowWhen=0
; sizes in pixels at 1080p (scaled with the screen height)
IconSize=46
Gap=5
; horizontal: Anchor = which point of the bar PosX places (0 left edge, 1 centre, 2 right edge), PosX = fraction of screen
; width; PosY = bottom edge, fraction of screen height. Example for the bottom-left corner: Anchor=0, PosX=0.015, PosY=0.97
Anchor=1
PosX=0.5
PosY=0.86
Opacity=0.9
; opacity factor of the rows whose modifier isn't held
DimInactive=0.45
ShowNames=0
ShowEmpty=1
HideEmptyRows=1

[Debug]
; 1 = log the input state on every mouse button press in gameplay (rate-limited) to SKSE/SpellChords.log, to diagnose
; mouse clicks that stop working in gameplay
LogMouseState=0
